task_id: artifact_001_file_created_visible
prompt: "Create artifacts/todo.txt containing the line 'buy milk'."
workspace_provider: local
graders:
  - grader_type: file_exists
    path: artifacts/todo.txt
  - grader_type: file_contains
    path: artifacts/todo.txt
    text: "buy milk"
  - grader_type: tool_call_recorded
    tool_name: workspace-write_file
  - grader_type: artifact_recorded
    workspace_path: artifacts/todo.txt
  - grader_type: db_assertion
    assertion: tool_events_linked
  - grader_type: db_assertion
    assertion: latency_fields_present
  - grader_type: run_ended_clean
